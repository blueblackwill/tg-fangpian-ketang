<div id="app" class="app">
  <div class="tg-shell" id="tgShell">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <button class="icon-btn only-desktop" id="menuBtn" title="菜单"><svg><use href="#i-menu"/></svg></button>
        <label class="search-box"><svg><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="搜索" autocomplete="off" spellcheck="false"></label>
      </div>
      <nav class="folders" id="folders"></nav>
      <div class="chat-list" id="chatList"></div>
      <div class="side-footer" id="sideFooter"></div>
    </aside>

    <main class="chat" id="chatPane">
      <header class="chat-head" id="chatHead"></header>
      <div class="pinned-bar hidden" id="pinnedBar"></div>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap" id="composerWrap"></div>
    </main>

    <aside class="info-panel" id="infoPanel"></aside>
  </div>

  <button class="classroom-fab" id="classroomFab" title="课堂面板（T）" aria-label="课堂面板">
    <svg><use href="#i-paperboat"/></svg>
  </button>
  <div class="sim-badge" id="simBadge">纸舟课堂 · 仿真演练</div>
</div>

<div class="browser-overlay" id="browser" aria-hidden="true">
  <div class="browser-chrome">
    <button class="icon-btn" id="browserClose" title="关闭"><svg><use href="#i-close"/></svg></button>
    <div class="urlbar" id="urlbar">
      <button class="url-lock" id="urlLock" title="连接信息"><svg><use href="#i-lock"/></svg></button>
      <span class="url-host" id="urlHost">okpay-app.xyz</span>
      <span class="url-path" id="urlPath">/wallet/bind</span>
      <button class="url-reload" id="urlReload" title="刷新"><svg><use href="#i-reload"/></svg></button>
    </div>
    <button class="icon-btn" id="browserMenu" title="更多"><svg><use href="#i-more"/></svg></button>
  </div>
  <div class="browser-progress" id="browserProgress"></div>
  <div class="browser-body" id="browserBody"></div>
</div>

<div class="wallet-overlay" id="walletSheet" aria-hidden="true">
  <div class="wallet-card" id="walletCard"></div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<div class="splash" id="splash">
  <div class="splash-card">
    <div class="splash-logo"><svg><use href="#i-paperboat"/></svg></div>
    <div class="splash-kicker">纸舟课堂 · 课堂案例</div>
    <h1>Telegram 社群骗局仿真</h1>
    <p class="splash-sub">按 2026 年 8 月真实案例复原：云上商铺群 · 商城机器人 · Okpay 红包提现 · 钱包授权。</p>
    <ul class="splash-points">
      <li><b>完全本地</b>没有真实 Telegram 账号、群组或钱包</li>
      <li><b>可点可退</b>每一步都是真实按钮流程，走错可以重来</li>
      <li><b>课后复盘</b>记录了 8 个检查点的操作与证据</li>
    </ul>
    <div class="splash-actions">
      <button class="btn primary" id="startBlind">学生视角开始</button>
      <button class="btn ghost" id="startTeach">教师视角（带讲解）</button>
      <a class="btn ghost" href="index.html#split">左右对照</a>
    </div>
    <button class="splash-resume hidden" id="resumeSession">继续上次演练</button>
    <p class="splash-foot">仿真域名、地址与余额均为课堂虚构；证据图来自频道公开材料，已脱敏。</p>
  </div>
</div>

<div class="teacher-overlay" id="teacherPanel" aria-hidden="true"></div>
<div class="review-overlay" id="review" aria-hidden="true"></div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/webpages.js"></script>
<script src="js/flows.js"></script>
<script src="js/classroom.js"></script>
<script src="js/split.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
